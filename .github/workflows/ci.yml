name: Oxidize-C CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test & Verify Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Differential Testing Oracle (PoC Benchmarks)
        run: |
          python poc/diff_test_oracle.py

      - name: Run Cargo Format Check
        run: cargo fmt --all -- --check

      - name: Run Cargo Clippy (Zero Warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
