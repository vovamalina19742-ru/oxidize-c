name: Release Builds

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: oxidize-c-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: oxidize-c-windows-x86_64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: oxidize-c-macos-arm64

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build CLI Binary
        run: cargo build --release --target ${{ matrix.target }} --bin oxidize-c

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: target/${{ matrix.target }}/release/oxidize-c*
