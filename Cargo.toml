[workspace]
resolver = "2"
members = [
    "crates/oxidize-alloc",
    "crates/oxidize-core",
    "crates/oxidize-llm",
    "crates/oxidize-verifier",
    "crates/oxidize-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Oxidize-C Core Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/oxidize-c/oxidize-c"
description = "Intelligent Hybrid C-to-Safe-Rust Transpiler & Verification IDE"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive", "cargo"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.38", features = ["full"] }
colored = "2.1"
regex = "1.10"
slotmap = "1.0"
